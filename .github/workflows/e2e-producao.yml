name: E2E produção

# Suíte completa contra produção — diária e sob demanda.
# Requer os secrets abaixo configurados em Settings → Secrets:
#   E2E_ADMIN_EMAIL, E2E_ADMIN_SENHA, E2E_WEBHOOK_SECRET, E2E_MOTOR_INGEST_TOKEN,
#   E2E_EDGE_TOKEN (mesmo segredo `x-edge-token` do Worker/Railway)

on:
  schedule:
    - cron: "0 8 * * *" # 05:00 BRT — smoke diário
    - cron: "0 9 * * 0" # domingo 06:00 BRT — carga semanal (perf)
  workflow_dispatch:

jobs:
  integracao:
    name: integração (fronteiras/contratos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_CORE_API: https://core-api-production-5553.up.railway.app
      E2E_OPS_API: https://operations-api-production-d580.up.railway.app
      E2E_REALTIME: https://realtime-engine-production-081f.up.railway.app
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_SENHA: ${{ secrets.E2E_ADMIN_SENHA }}
      E2E_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
      E2E_MOTOR_INGEST_TOKEN: ${{ secrets.E2E_MOTOR_INGEST_TOKEN }}
      E2E_EDGE_TOKEN: ${{ secrets.E2E_EDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: tests/integration
      - run: npx playwright test
        working-directory: tests/integration

  e2e:
    name: e2e (API + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_CORE_API: https://core-api-production-5553.up.railway.app
      E2E_OPS_API: https://operations-api-production-d580.up.railway.app
      E2E_REALTIME: https://realtime-engine-production-081f.up.railway.app
      E2E_WEB_URL: https://hweld-loja.vinicius-softengineer.workers.dev
      E2E_ADMIN_URL: https://hweld-admin.vinicius-softengineer.workers.dev
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_SENHA: ${{ secrets.E2E_ADMIN_SENHA }}
      E2E_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
      E2E_MOTOR_INGEST_TOKEN: ${{ secrets.E2E_MOTOR_INGEST_TOKEN }}
      E2E_EDGE_TOKEN: ${{ secrets.E2E_EDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  performance:
    name: performance (carga/latência)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 0'
    env:
      E2E_CORE_API: https://core-api-production-5553.up.railway.app
      E2E_OPS_API: https://operations-api-production-d580.up.railway.app
      E2E_REALTIME: https://realtime-engine-production-081f.up.railway.app
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_SENHA: ${{ secrets.E2E_ADMIN_SENHA }}
      E2E_EDGE_TOKEN: ${{ secrets.E2E_EDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: tests/performance
      - run: npx playwright test
        working-directory: tests/performance
