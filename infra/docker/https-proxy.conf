# HTTPS local (dev) — self-signed em infra/docker/certs/.
# 443  → painel-admin (React)
# 8443 → web (Angular)
# O painel-admin/web internos já proxiam /api/v1 e /events —
# aqui só repassamos, com SSE desbufferizado.

server {
    listen 443 ssl;
    server_name localhost hweld.local;

    ssl_certificate     /etc/nginx/certs/hweld.local.crt;
    ssl_certificate_key /etc/nginx/certs/hweld.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /events {
        proxy_pass http://painel-admin:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://painel-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 8443 ssl;
    server_name localhost hweld.local;

    ssl_certificate     /etc/nginx/certs/hweld.local.crt;
    ssl_certificate_key /etc/nginx/certs/hweld.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
