<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script>
      // Tema antes do primeiro paint — evita flash claro/escuro no load.
      (function () {
        try {
          var t = localStorage.getItem("hweld-theme") || localStorage.getItem("finpay-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="viewport"
      content="Painel administrativo HWeld — CRM, vendas, catálogo, estoque e financeiro."
