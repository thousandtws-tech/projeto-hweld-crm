services:
  postgres:
    image: postgres:17-alpine
    container_name: hweld-postgres
    environment:
      POSTGRES_USER: hweld
      POSTGRES_PASSWORD: hweld
      POSTGRES_DB: hweld
    ports:
      - "5432:5432"
    volumes:
      - hweld-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hweld -d hweld"]
      interval: 5s
      timeout: 3s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: hweld-elasticsearch
    environment:
      discovery.type: single-node
      # dev — sem TLS/auth. Produção: xpack.security + credenciais
      # (ELASTICSEARCH_USERNAME/PASSWORD) e HTTPS.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - hweld-esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    container_name: hweld-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # chave dev-only p/ saved objects (dashboards, index patterns).
      # Produção: gerar aleatória (≥32 chars) e guardar como segredo.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: dev-key-kibana-hweld-32chars-min!!
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

volumes:
  hweld-pgdata:
  hweld-esdata:
