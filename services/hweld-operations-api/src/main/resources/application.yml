spring:
  application:
    name: hweld-operations-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hweld}
    username: ${DB_USER:hweld}
    password: ${DB_PASSWORD:hweld}
    hikari:
      maximum-pool-size: ${DB_MAX_CONNECTIONS:10}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

    baseline-on-migrate: true
    baseline-version: "0"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:admin}
    password: ${SMTP_PASSWORD:123}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${PORT:8090}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Sem SMTP real em dev (EMAIL_PROVIDER=log), o indicador de mail daria
    # DOWN permanente — os probes liveness/readiness seguem ativos.
    mail:
      enabled: false
  observations:
    key-values:
      application: hweld-operations-api
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:https://otlp.nr-data.net}/v1/traces
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.hweld.operations: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%15.15thread] %logger{36} trace=%X{traceId:-} corr=%X{correlationId:-} | %msg%n"

hweld:
  security:
    # Mesmo segredo HS256 do core-api (>=32 bytes). OBRIGATÓRIO — sem default:
    # um segredo conhecido em fallback deixaria tokens falsificáveis em prod.
    jwt-secret: ${JWT_SECRET}
    # Token service-to-service para /api/v1/internal/** — também fail-fast.
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  core-api:
    url: ${CORE_API_URL:http://localhost:8080}
    timeout-ms: ${CORE_API_TIMEOUT_MS:4000}
  motor:
    url: ${MOTOR_URL:http://localhost:4100}
    token: ${MOTOR_INGEST_TOKEN:}
    timeout-ms: ${MOTOR_TIMEOUT_MS:1500}
  outbox:
    poll-interval-ms: 2000
    batch-size: 50
    max-attempts: 8
    # Lease do claim SKIP LOCKED — worker morto devolve o evento à fila após o lease.
    claim-lease-ms: ${OUTBOX_CLAIM_LEASE_MS:60000}
  payment:
    default-provider: ${PAYMENT_PROVIDER:stub}
    webhook-secrets:
      # Vazio = nenhum webhook stub passa na validação de assinatura (fail-safe).
      stub: ${PAYMENT_STUB_WEBHOOK_SECRET:}
      # mercadopago: ${PAYMENT_MP_WEBHOOK_SECRET:}
      # asaas: ${PAYMENT_ASAAS_WEBHOOK_SECRET:}
    pix-expiration-minutes: 30
    # Dev only: aceita webhook do provider 'stub' sem assinatura. Sempre false fora de dev/test.
    allow-unsigned-stub-webhook: ${PAYMENT_STUB_ALLOW_UNSIGNED:false}
  fiscal:
    provider: ${FISCAL_PROVIDER:stub}
    auto-emit-on-payment-confirmed: ${FISCAL_AUTO_EMIT:false}
    ambiente: ${FISCAL_AMBIENTE:homologacao}
  storage:
    # MinIO/S3 — endpoint ausente = NoopObjectStorage (dev sem infra).
    endpoint: ${MINIO_ENDPOINT:}
    bucket: ${MINIO_BUCKET:hweld}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
  notification:
    email-provider: ${EMAIL_PROVIDER:log}   # log | smtp
    max-attempts: 4
    retry-base-delay-ms: 30000
    default-from: ${MAIL_FROM:noreply@hweld.com.br}
    default-from-name: ${MAIL_FROM_NAME:HWeld}

springdoc:
  # Spec + UI expõem todas as rotas, incluindo /internal/** — desligar em prod.
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:true}
  api-docs:
    path: /api-docs
    enabled: ${API_DOCS_ENABLED:true}
