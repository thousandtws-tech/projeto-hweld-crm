spring:
  application:
    name: hweld-operations-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hweld}
    username: ${DB_USER:hweld}
    password: ${DB_PASSWORD:hweld}
    hikari:
      maximum-pool-size: ${DB_MAX_CONNECTIONS:10}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

    baseline-on-migrate: true
    baseline-version: "0"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:admin}
    password: ${SMTP_PASSWORD:123}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

server:
  port: ${PORT:8090}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/css,text/html,text/plain,application/javascript
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
  observations:
    key-values:
      application: hweld-operations-api
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:https://otlp.nr-data.net}/v1/traces
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.hweld.operations: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%15.15thread] %logger{36} trace=%X{traceId:-} corr=%X{correlationId:-} | %msg%n"

hweld:
  security:
    jwt-secret: ${JWT_SECRET}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}
    edge-token: ${EDGE_TOKEN:}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  core-api:
    url: ${CORE_API_URL:http://localhost:8080}
    timeout-ms: ${CORE_API_TIMEOUT_MS:4000}
    # Segredo de borda do core-api — quando EDGE_TOKEN está ligado na origem,
    # chamadas sem o header morrem em 403. Fallback: mesmo EDGE_TOKEN do
    # Worker (segredo compartilhado entre as origens do Railway).
    edge-token: ${CORE_API_EDGE_TOKEN:${EDGE_TOKEN:}}
  motor:
    url: ${MOTOR_URL:http://localhost:4100}
    token: ${MOTOR_INGEST_TOKEN:}
    timeout-ms: ${MOTOR_TIMEOUT_MS:1500}
  outbox:
    poll-interval-ms: 2000
    batch-size: 50
    max-attempts: 8
    claim-lease-ms: ${OUTBOX_CLAIM_LEASE_MS:60000}
  payment:
    default-provider: ${PAYMENT_PROVIDER:auto}
    webhook-secrets:
      stub: ${PAYMENT_STUB_WEBHOOK_SECRET:}
    pix-expiration-minutes: ${PAYMENT_PIX_EXPIRATION_MINUTES:30}
    pagbank:
      timeout-ms: ${PAGBANK_TIMEOUT_MS:10000}
    mercadopago:
      timeout-ms: ${MERCADOPAGO_TIMEOUT_MS:10000}
    allow-unsigned-stub-webhook: ${PAYMENT_STUB_ALLOW_UNSIGNED:false}
  fiscal:
    provider: ${FISCAL_PROVIDER:auto}
    auto-emit-on-payment-confirmed: ${FISCAL_AUTO_EMIT:false}
    ambiente: ${FISCAL_AMBIENTE:homologacao}
    reconcile-interval-ms: ${FISCAL_RECONCILE_INTERVAL_MS:120000}
    reconcile-initial-delay-ms: ${FISCAL_RECONCILE_INITIAL_DELAY_MS:30000}
    reconcile-min-age-ms: ${FISCAL_RECONCILE_MIN_AGE_MS:60000}
    reconcile-batch-size: ${FISCAL_RECONCILE_BATCH_SIZE:20}
    nfe:
      natureza-operacao: ${FISCAL_NFE_NATUREZA_OPERACAO:Venda de mercadoria}
      cfop: ${FISCAL_NFE_CFOP:}
      unidade: ${FISCAL_NFE_UNIDADE:UN}
      tipo-documento: ${FISCAL_NFE_TIPO_DOCUMENTO:1}
      finalidade-emissao: ${FISCAL_NFE_FINALIDADE_EMISSAO:1}
      modalidade-frete: ${FISCAL_NFE_MODALIDADE_FRETE:9}
      presenca-comprador: ${FISCAL_NFE_PRESENCA_COMPRADOR:9}
      consumidor-final: ${FISCAL_NFE_CONSUMIDOR_FINAL:0}
      indicador-ie-destinatario: ${FISCAL_NFE_INDICADOR_IE_DESTINATARIO:}
      icms-origem: ${FISCAL_NFE_ICMS_ORIGEM:0}
      icms-situacao-tributaria: ${FISCAL_NFE_ICMS_ST:}
      pis-situacao-tributaria: ${FISCAL_NFE_PIS_ST:}
      cofins-situacao-tributaria: ${FISCAL_NFE_COFINS_ST:}
  logistics:
    provider: ${LOGISTICS_PROVIDER:auto}
    timeout-ms: ${LOGISTICS_TIMEOUT_MS:15000}
    user-agent: ${LOGISTICS_USER_AGENT:HWeld Operations (contato@hweld.com.br)}
  storage:
    endpoint: ${MINIO_ENDPOINT:}
    bucket: ${MINIO_BUCKET:hweld}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
  notification:
    email-provider: ${EMAIL_PROVIDER:log}
    sms-provider: ${SMS_PROVIDER:auto}
    max-attempts: 4
    retry-base-delay-ms: 30000
    dlr-reconcile-age-ms: ${SMS_DLR_RECONCILE_AGE_MS:21600000}
    default-from: ${MAIL_FROM:noreply@hweld.com.br}
    default-from-name: ${MAIL_FROM_NAME:HWeld}
    infobip:
      timeout-ms: ${INFOBIP_TIMEOUT_MS:10000}
      public-base-url: ${APP_PUBLIC_URL:}
  integrations:
    secrets-key: ${INTEGRATION_SECRETS_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:false}
  api-docs:
    path: /api-docs
    enabled: ${API_DOCS_ENABLED:false}
