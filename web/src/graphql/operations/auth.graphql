# Saúde e autenticação.

query Health {
  health {
    status
    versao
  }
}

query Ready {
  ready {
    status
    versao
  }
}

mutation LoginStaff($email: String!, $senha: String!) {
  loginStaff(email: $email, senha: $senha) {
    accessToken
    tokenType
    accessExpiraEm
    refreshToken
    refreshExpiraEm
  }
}

mutation LoginPortal($email: String!, $senha: String!) {
  loginPortal(email: $email, senha: $senha) {
    accessToken
    tokenType
    accessExpiraEm
    refreshToken
    refreshExpiraEm
    contato {
      id
      nome
      empresaId
    }
  }
}

mutation RefreshSession($refreshToken: String!) {
  refreshSession(refreshToken: $refreshToken) {
    accessToken
    tokenType
    accessExpiraEm
    refreshToken
    refreshExpiraEm
  }
}

mutation Logout($refreshToken: String!) {
  logout(refreshToken: $refreshToken)
}

mutation TrocarSenha($senhaAtual: String!, $novaSenha: String!) {
  trocarSenha(senhaAtual: $senhaAtual, novaSenha: $novaSenha)
}
