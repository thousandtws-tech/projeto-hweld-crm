# CRM — empresas, contatos, endereços, oportunidades, interações.

fragment EmpresaFields on Empresa {
  id
  razaoSocial
  nomeFantasia
  cnpj
  inscricaoEstadual
  segmento
  telefone
  email
  site
  status
  tabelaPrecoId
  observacoes
  createdAt
  updatedAt
  deletedAt
}

fragment ContatoFields on Contato {
  id
  empresaId
  nome
  cargo
  email
  telefone
  whatsapp
  isPrincipal
  acessoPortal
  observacoes
  createdAt
  updatedAt
  deletedAt
}

fragment EnderecoFields on Endereco {
  id
  empresaId
  tipo
  logradouro
  numero
  complemento
  bairro
  cidade
  uf
  cep
  pais
  principal
  createdAt
  updatedAt
}

fragment OportunidadeFields on Oportunidade {
  id
  empresaId
  contatoId
  responsavelId
  titulo
  descricao
  origem
  estagio
  valorEstimado
  dataPrevistaFechamento
  motivoPerda
  createdAt
  updatedAt
}

fragment InteracaoFields on Interacao {
  id
  empresaId
  contatoId
  oportunidadeId
  usuarioId
  tipo
  assunto
  descricao
  ocorridoEm
  proximaAcao
  proximaAcaoEm
  createdAt
}

query Empresas(
  $pagina: Int
  $porPagina: Int
  $status: StatusEmpresa
  $busca: String
) {
  empresas(
    pagina: $pagina
    porPagina: $porPagina
    status: $status
    busca: $busca
  ) {
    itens {
      ...EmpresaFields
    }
    total
    pagina
    porPagina
    totalPaginas
  }
}

query Empresa($id: ID!) {
  empresa(id: $id) {
    ...EmpresaFields
  }
}

query Contatos(
  $pagina: Int
  $porPagina: Int
  $empresaId: ID
  $busca: String
) {
  contatos(
    pagina: $pagina
    porPagina: $porPagina
    empresaId: $empresaId
    busca: $busca
  ) {
    itens {
      ...ContatoFields
    }
    total
    pagina
    porPagina
    totalPaginas
  }
}

query Contato($id: ID!) {
  contato(id: $id) {
    ...ContatoFields
  }
}

query Enderecos($empresaId: ID!, $tipo: TipoEndereco) {
  enderecos(empresaId: $empresaId, tipo: $tipo) {
    ...EnderecoFields
  }
}

query Oportunidades(
  $pagina: Int
  $porPagina: Int
  $estagio: EstagioOportunidade
  $empresaId: ID
  $responsavelId: ID
) {
  oportunidades(
    pagina: $pagina
    porPagina: $porPagina
    estagio: $estagio
    empresaId: $empresaId
    responsavelId: $responsavelId
  ) {
    itens {
      ...OportunidadeFields
    }
    total
    pagina
    porPagina
    totalPaginas
  }
}

query Oportunidade($id: ID!) {
  oportunidade(id: $id) {
    ...OportunidadeFields
  }
}

query Interacoes(
  $pagina: Int
  $porPagina: Int
  $empresaId: ID
  $oportunidadeId: ID
  $contatoId: ID
) {
  interacoes(
    pagina: $pagina
    porPagina: $porPagina
    empresaId: $empresaId
    oportunidadeId: $oportunidadeId
    contatoId: $contatoId
  ) {
    itens {
      ...InteracaoFields
    }
    total
    pagina
    porPagina
    totalPaginas
  }
}

mutation CriarEmpresa($input: EmpresaInput!) {
  criarEmpresa(input: $input) {
    ...EmpresaFields
  }
}

mutation AtualizarEmpresa($id: ID!, $input: EmpresaInput!) {
  atualizarEmpresa(id: $id, input: $input) {
    ...EmpresaFields
  }
}

mutation ArquivarEmpresa($id: ID!) {
  arquivarEmpresa(id: $id)
}

mutation CriarContato($input: ContatoInput!) {
  criarContato(input: $input) {
    ...ContatoFields
  }
}

mutation AtualizarContato($id: ID!, $input: ContatoInput!) {
  atualizarContato(id: $id, input: $input) {
    ...ContatoFields
  }
}

mutation AtivarPortalContato($id: ID!, $senha: String!) {
  ativarPortalContato(id: $id, senha: $senha)
}

mutation DesativarPortalContato($id: ID!) {
  desativarPortalContato(id: $id)
}

mutation ArquivarContato($id: ID!) {
  arquivarContato(id: $id)
}

mutation CriarEndereco($input: EnderecoInput!) {
  criarEndereco(input: $input) {
    ...EnderecoFields
  }
}

mutation AtualizarEndereco($id: ID!, $input: EnderecoInput!) {
  atualizarEndereco(id: $id, input: $input) {
    ...EnderecoFields
  }
}

mutation RemoverEndereco($id: ID!) {
  removerEndereco(id: $id)
}

mutation CriarOportunidade($input: OportunidadeInput!) {
  criarOportunidade(input: $input) {
    ...OportunidadeFields
  }
}

mutation AtualizarOportunidade($id: ID!, $input: OportunidadeInput!) {
  atualizarOportunidade(id: $id, input: $input) {
    ...OportunidadeFields
  }
}

mutation MoverEstagioOportunidade(
  $id: ID!
  $estagio: EstagioOportunidade!
  $motivoPerda: String
) {
  moverEstagioOportunidade(
    id: $id
    estagio: $estagio
    motivoPerda: $motivoPerda
  ) {
    ...OportunidadeFields
  }
}

mutation RegistrarInteracao($input: InteracaoInput!) {
  registrarInteracao(input: $input) {
    ...InteracaoFields
  }
}
