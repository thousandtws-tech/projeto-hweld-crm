# Catálogo — categorias, produtos, tabelas de preço.

fragment CategoriaFields on Categoria {
  id
  categoriaPaiId
  nome
  slug
  descricao
  imagemUrl
  ordem
  ativa
  createdAt
  updatedAt
}

fragment ProdutoFields on Produto {
  id
  sku
  nome
  slug
  categoriaId
  marca
  unidadeMedida
  descricaoCurta
  descricaoTecnica
  ncm
  origemMercadoria
  pesoKg
  alturaCm
  larguraCm
  comprimentoCm
  precoCusto
  precoVenda
  estoqueMinimo
  controlaEstoque
  ativo
  destaque
  createdAt
  updatedAt
  deletedAt
}

fragment ProdutoImagemFields on ProdutoImagem {
  id
  produtoId
  url
  altText
  ordem
  isPrincipal
}

fragment TabelaPrecoFields on TabelaPreco {
  id
  nome
  descricao
  ativa
  createdAt
  updatedAt
}

fragment TabelaPrecoItemFields on TabelaPrecoItem {
  id
  tabelaPrecoId
  produtoId
  preco
}

query Categorias($somenteAtivas: Boolean) {
  categorias(somenteAtivas: $somenteAtivas) {
    ...CategoriaFields
  }
}

query Produtos(
  $pagina: Int
  $porPagina: Int
  $categoriaId: ID
  $busca: String
  $ativo: Boolean
  $destaque: Boolean
) {
  produtos(
    pagina: $pagina
    porPagina: $porPagina
    categoriaId: $categoriaId
    busca: $busca
    ativo: $ativo
    destaque: $destaque
  ) {
    itens {
      ...ProdutoFields
    }
    total
    pagina
    porPagina
    totalPaginas
  }
}

query Produto($id: ID!) {
  produto(id: $id) {
    produto {
      ...ProdutoFields
    }
    imagens {
      ...ProdutoImagemFields
    }
  }
}

query TabelasPreco($pagina: Int, $porPagina: Int, $ativa: Boolean) {
  tabelasPreco(pagina: $pagina, porPagina: $porPagina, ativa: $ativa) {
    itens {
      ...TabelaPrecoFields
    }
    total
    pagina
    porPagina
    totalPaginas
  }
}

query TabelaPreco($id: ID!) {
  tabelaPreco(id: $id) {
    tabela {
      ...TabelaPrecoFields
    }
    itens {
      ...TabelaPrecoItemFields
    }
  }
}

mutation CriarCategoria($input: CategoriaInput!) {
  criarCategoria(input: $input) {
    ...CategoriaFields
  }
}

mutation AtualizarCategoria($id: ID!, $input: CategoriaInput!) {
  atualizarCategoria(id: $id, input: $input) {
    ...CategoriaFields
  }
}

mutation CriarProduto($input: ProdutoInput!) {
  criarProduto(input: $input) {
    ...ProdutoFields
  }
}

mutation AtualizarProduto($id: ID!, $input: ProdutoInput!) {
  atualizarProduto(id: $id, input: $input) {
    ...ProdutoFields
  }
}

mutation ArquivarProduto($id: ID!) {
  arquivarProduto(id: $id)
}

mutation CriarTabelaPreco($input: TabelaPrecoInput!) {
  criarTabelaPreco(input: $input) {
    ...TabelaPrecoFields
  }
}

mutation AtualizarTabelaPreco($id: ID!, $input: TabelaPrecoInput!) {
  atualizarTabelaPreco(id: $id, input: $input) {
    ...TabelaPrecoFields
  }
}

mutation DefinirPrecoTabela($tabelaId: ID!, $produtoId: ID!, $preco: Decimal!) {
  definirPrecoTabela(tabelaId: $tabelaId, produtoId: $produtoId, preco: $preco) {
    ...TabelaPrecoItemFields
  }
}

mutation RemoverItemTabela($tabelaId: ID!, $produtoId: ID!) {
  removerItemTabela(tabelaId: $tabelaId, produtoId: $produtoId)
}
