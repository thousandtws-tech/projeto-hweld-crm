# Catálogo — categorias, produtos e tabelas de preço B2B.

type Categoria {
  id: ID!
  categoriaPaiId: ID
  nome: String!
  slug: String!
  descricao: String
  imagemUrl: String
  ordem: Int!
  ativa: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Produto {
  id: ID!
  sku: String!
  nome: String!
  slug: String!
  categoriaId: ID!
  marca: String
  unidadeMedida: String
  descricaoCurta: String
  descricaoTecnica: String
  ncm: String
  origemMercadoria: String!
  pesoKg: Decimal
  alturaCm: Decimal
  larguraCm: Decimal
  comprimentoCm: Decimal
  precoCusto: Decimal
  precoVenda: Decimal!
  estoqueMinimo: Decimal
  controlaEstoque: Boolean!
  ativo: Boolean!
  destaque: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type ProdutoImagem {
  id: ID!
  produtoId: ID!
  url: String!
  altText: String
  ordem: Int!
  isPrincipal: Boolean!
}

type ProdutoDetalhe {
  produto: Produto!
  imagens: [ProdutoImagem!]!
}

type ProdutoPagina {
  itens: [Produto!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

type TabelaPreco {
  id: ID!
  nome: String!
  descricao: String
  ativa: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TabelaPrecoItem {
  id: ID!
  tabelaPrecoId: ID!
  produtoId: ID!
  preco: Decimal!
}

type TabelaPrecoDetalhe {
  tabela: TabelaPreco!
  itens: [TabelaPrecoItem!]!
}

type TabelaPrecoPagina {
  itens: [TabelaPreco!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

# ── Inputs ───────────────────────────────────────────────────────────────────

input CategoriaInput {
  categoriaPaiId: ID
  nome: String!
  slug: String
  descricao: String
  imagemUrl: String
  ordem: Int!
  ativa: Boolean!
}

input ProdutoInput {
  sku: String!
  nome: String!
  slug: String
  categoriaId: ID!
  marca: String
  unidadeMedida: String
  descricaoCurta: String
  descricaoTecnica: String
  ncm: String
  origemMercadoria: String
  pesoKg: Decimal
  alturaCm: Decimal
  larguraCm: Decimal
  comprimentoCm: Decimal
  precoCusto: Decimal
  precoVenda: Decimal!
  estoqueMinimo: Decimal
  controlaEstoque: Boolean!
  ativo: Boolean!
  destaque: Boolean!
}

input TabelaPrecoInput {
  nome: String!
  descricao: String
  ativa: Boolean!
}

extend type Query {
  "Árvore de categorias (somenteAtivas filtra inativas)."
  categorias(somenteAtivas: Boolean): [Categoria!]!

  produtos(
    pagina: Int
    porPagina: Int
    categoriaId: ID
    busca: String
    ativo: Boolean
    destaque: Boolean
  ): ProdutoPagina!
  "Produto + imagens."
  produto(id: ID!): ProdutoDetalhe

  tabelasPreco(pagina: Int, porPagina: Int, ativa: Boolean): TabelaPrecoPagina!
  "Tabela de preço + itens."
  tabelaPreco(id: ID!): TabelaPrecoDetalhe
}

extend type Mutation {
  criarCategoria(input: CategoriaInput!): Categoria!
  atualizarCategoria(id: ID!, input: CategoriaInput!): Categoria!

  criarProduto(input: ProdutoInput!): Produto!
  atualizarProduto(id: ID!, input: ProdutoInput!): Produto!
  "Soft-delete do produto (desindexa do motor de busca)."
  arquivarProduto(id: ID!): Boolean

  criarTabelaPreco(input: TabelaPrecoInput!): TabelaPreco!
  atualizarTabelaPreco(id: ID!, input: TabelaPrecoInput!): TabelaPreco!
  "Define/atualiza o preço de um produto na tabela."
  definirPrecoTabela(
    tabelaId: ID!
    produtoId: ID!
    preco: Decimal!
  ): TabelaPrecoItem!
  removerItemTabela(tabelaId: ID!, produtoId: ID!): Boolean
}
