# Usuários internos (staff) — administração restrita a Perfil.admin.

type Usuario {
  id: ID!
  nome: String!
  email: String!
  perfil: Perfil!
  ativo: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type UsuarioPagina {
  itens: [Usuario!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

input CriarUsuarioInput {
  nome: String!
  email: String!
  senha: String!
  perfil: Perfil!
}

input AtualizarUsuarioInput {
  nome: String
  email: String
  perfil: Perfil
}

extend type Query {
  "Lista usuários staff (somente admin)."
  usuarios(
    pagina: Int
    porPagina: Int
    perfil: Perfil
    ativo: Boolean
    busca: String
  ): UsuarioPagina!
  "Busca usuário por id (somente admin)."
  usuario(id: ID!): Usuario
}

extend type Mutation {
  criarUsuario(input: CriarUsuarioInput!): Usuario!
  atualizarUsuario(id: ID!, input: AtualizarUsuarioInput!): Usuario!
  definirUsuarioAtivo(id: ID!, ativo: Boolean!): Boolean
}
