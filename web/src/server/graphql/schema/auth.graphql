# Saúde (sem auth) e autenticação — staff e portal com contextos distintos.

type Saude {
  status: String!
  versao: String!
}

type Tokens {
  accessToken: String!
  tokenType: String!
  accessExpiraEm: Int!
  refreshToken: String!
  refreshExpiraEm: Int!
}

type ContatoSessao {
  id: ID!
  nome: String!
  empresaId: ID!
}

type LoginPortalPayload {
  accessToken: String!
  tokenType: String!
  accessExpiraEm: Int!
  refreshToken: String!
  refreshExpiraEm: Int!
  contato: ContatoSessao!
}

extend type Query {
  "Liveness do backend (sem autenticação)."
  health: Saude!
  "Readiness do backend + banco (sem autenticação)."
  ready: Saude!
}

extend type Mutation {
  "Login de usuário interno (vendedor/admin/...). Retorna par de tokens JWT."
  loginStaff(email: String!, senha: String!): Tokens!
  "Login de contato do portal B2B — tokens + dados do contato/empresa."
  loginPortal(email: String!, senha: String!): LoginPortalPayload!
  "Rotaciona o refresh token — o anterior é revogado."
  refreshSession(refreshToken: String!): Tokens!
  "Revoga o refresh token (logout)."
  logout(refreshToken: String!): Boolean
  "Troca a senha do usuário staff autenticado."
  trocarSenha(senhaAtual: String!, novaSenha: String!): Boolean
}
