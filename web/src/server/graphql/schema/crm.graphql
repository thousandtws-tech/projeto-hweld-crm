# CRM — empresas, contatos, endereços, oportunidades e interações (timeline).

type Empresa {
  id: ID!
  razaoSocial: String!
  nomeFantasia: String
  cnpj: String
  inscricaoEstadual: String
  segmento: String
  telefone: String
  email: String
  site: String
  status: StatusEmpresa!
  tabelaPrecoId: ID
  observacoes: String
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type EmpresaPagina {
  itens: [Empresa!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

type Contato {
  id: ID!
  empresaId: ID!
  nome: String!
  cargo: String
  email: String
  telefone: String
  whatsapp: String
  isPrincipal: Boolean!
  acessoPortal: Boolean!
  observacoes: String
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type ContatoPagina {
  itens: [Contato!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

type Endereco {
  id: ID!
  empresaId: ID!
  tipo: TipoEndereco!
  logradouro: String
  numero: String
  complemento: String
  bairro: String
  cidade: String!
  uf: String!
  cep: String!
  pais: String!
  principal: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Oportunidade {
  id: ID!
  empresaId: ID!
  contatoId: ID
  responsavelId: ID!
  titulo: String!
  descricao: String
  origem: OrigemOportunidade
  estagio: EstagioOportunidade!
  valorEstimado: Decimal
  dataPrevistaFechamento: Date
  motivoPerda: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type OportunidadePagina {
  itens: [Oportunidade!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

type Interacao {
  id: ID!
  empresaId: ID!
  contatoId: ID
  oportunidadeId: ID
  usuarioId: ID
  tipo: TipoInteracao!
  assunto: String
  descricao: String
  ocorridoEm: DateTime!
  proximaAcao: String
  proximaAcaoEm: DateTime
  createdAt: DateTime!
}

type InteracaoPagina {
  itens: [Interacao!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

# ── Inputs ───────────────────────────────────────────────────────────────────

input EmpresaInput {
  razaoSocial: String!
  nomeFantasia: String
  cnpj: String
  inscricaoEstadual: String
  segmento: String
  telefone: String
  email: String
  site: String
  status: StatusEmpresa!
  tabelaPrecoId: ID
  observacoes: String
}

input ContatoInput {
  empresaId: ID!
  nome: String!
  cargo: String
  email: String
  telefone: String
  whatsapp: String
  isPrincipal: Boolean!
  acessoPortal: Boolean!
  observacoes: String
}

input EnderecoInput {
  empresaId: ID!
  tipo: TipoEndereco!
  logradouro: String
  numero: String
  complemento: String
  bairro: String
  cidade: String!
  uf: String!
  cep: String!
  pais: String
  principal: Boolean!
}

input OportunidadeInput {
  empresaId: ID!
  contatoId: ID
  responsavelId: ID!
  titulo: String!
  descricao: String
  origem: OrigemOportunidade
  valorEstimado: Decimal
  dataPrevistaFechamento: Date
}

input InteracaoInput {
  empresaId: ID!
  contatoId: ID
  oportunidadeId: ID
  tipo: TipoInteracao!
  assunto: String
  descricao: String
  ocorridoEm: DateTime
  proximaAcao: String
  proximaAcaoEm: DateTime
}

extend type Query {
  empresas(
    pagina: Int
    porPagina: Int
    status: StatusEmpresa
    busca: String
  ): EmpresaPagina!
  empresa(id: ID!): Empresa

  contatos(
    pagina: Int
    porPagina: Int
    empresaId: ID
    busca: String
  ): ContatoPagina!
  contato(id: ID!): Contato

  "Endereços da empresa (filtro opcional por tipo)."
  enderecos(empresaId: ID!, tipo: TipoEndereco): [Endereco!]!

  oportunidades(
    pagina: Int
    porPagina: Int
    estagio: EstagioOportunidade
    empresaId: ID
    responsavelId: ID
  ): OportunidadePagina!
  oportunidade(id: ID!): Oportunidade

  "Timeline de interações (ligações, e-mails, visitas...)."
  interacoes(
    pagina: Int
    porPagina: Int
    empresaId: ID
    oportunidadeId: ID
    contatoId: ID
  ): InteracaoPagina!
}

extend type Mutation {
  criarEmpresa(input: EmpresaInput!): Empresa!
  atualizarEmpresa(id: ID!, input: EmpresaInput!): Empresa!
  "Soft-delete da empresa."
  arquivarEmpresa(id: ID!): Boolean

  criarContato(input: ContatoInput!): Contato!
  atualizarContato(id: ID!, input: ContatoInput!): Contato!
  "Ativa acesso ao portal B2B definindo a senha do contato."
  ativarPortalContato(id: ID!, senha: String!): Boolean
  desativarPortalContato(id: ID!): Boolean
  arquivarContato(id: ID!): Boolean

  criarEndereco(input: EnderecoInput!): Endereco!
  atualizarEndereco(id: ID!, input: EnderecoInput!): Endereco!
  removerEndereco(id: ID!): Boolean

  criarOportunidade(input: OportunidadeInput!): Oportunidade!
  atualizarOportunidade(id: ID!, input: OportunidadeInput!): Oportunidade!
  "Move oportunidade de estágio no funil (ganha/perdida exige motivoPerda)."
  moverEstagioOportunidade(
    id: ID!
    estagio: EstagioOportunidade!
    motivoPerda: String
  ): Oportunidade!

  registrarInteracao(input: InteracaoInput!): Interacao!
}
