# Ordens de serviço — CRUD, consumo de material e histórico de status.

type OrdemServico {
  id: ID!
  numero: String!
  pedidoId: ID
  empresaId: ID!
  contatoId: ID
  responsavelId: ID
  descricao: String
  status: StatusOs!
  prioridade: PrioridadeOs!
  abertaEm: DateTime!
  previstaEm: Date
  concluidaEm: DateTime
  valorMaoObra: Decimal
  valorTotal: Decimal
  observacoes: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type OsItem {
  id: ID!
  osId: ID!
  produtoId: ID!
  quantidade: Decimal!
  precoUnitario: Decimal!
  total: Decimal!
}

type OsHistorico {
  id: ID!
  osId: ID!
  statusAnterior: String
  statusNovo: String!
  usuarioId: ID
  observacao: String
  createdAt: DateTime!
}

type OrdemServicoDetalhe {
  ordem: OrdemServico!
  itens: [OsItem!]!
  historico: [OsHistorico!]!
}

type OrdemServicoPagina {
  itens: [OrdemServico!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

input OrdemServicoInput {
  pedidoId: ID
  empresaId: ID!
  contatoId: ID
  responsavelId: ID
  descricao: String
  prioridade: PrioridadeOs!
  previstaEm: Date
  valorMaoObra: Decimal
  observacoes: String
}

extend type Query {
  ordensServico(
    pagina: Int
    porPagina: Int
    status: StatusOs
    empresaId: ID
    pedidoId: ID
    responsavelId: ID
  ): OrdemServicoPagina!
  "OS + itens consumidos + histórico de status."
  ordemServico(id: ID!): OrdemServicoDetalhe
}

extend type Mutation {
  criarOrdemServico(input: OrdemServicoInput!): OrdemServico!
  "Consome material na OS — baixa de estoque na mesma transação."
  consumirMaterialOs(
    id: ID!
    produtoId: ID!
    quantidade: Decimal!
  ): OsItem!
  "Transição de status com observação (trilha de histórico imutável)."
  transicionarOrdemServico(
    id: ID!
    status: StatusOs!
    observacao: String
  ): OrdemServico!
}
