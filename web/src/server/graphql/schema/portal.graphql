# Portal B2B (contato autenticado) + busca + auditoria.

type FacetaContagem {
  valor: String!
  rotulo: String
  contagem: Int!
}

type Facetas {
  categorias: [FacetaContagem!]!
  marcas: [FacetaContagem!]!
  precoMin: Decimal
  precoMax: Decimal
}

"Item do catálogo B2B — produto com o preço efetivo da empresa do contato."
type ItemCatalogoPortal {
  id: ID!
  sku: String!
  nome: String!
  slug: String!
  categoriaId: ID!
  marca: String
  unidadeMedida: String
  descricaoCurta: String
  descricaoTecnica: String
  ncm: String
  origemMercadoria: String!
  pesoKg: Decimal
  alturaCm: Decimal
  larguraCm: Decimal
  comprimentoCm: Decimal
  precoCusto: Decimal
  precoVenda: Decimal!
  precoEfetivo: Decimal!
  estoqueMinimo: Decimal
  controlaEstoque: Boolean!
  ativo: Boolean!
  destaque: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

type CatalogoPortalPagina {
  itens: [ItemCatalogoPortal!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

"Hit de busca do portal — produto + precoEfetivo + score de relevância."
type ItemBuscaPortal {
  id: ID!
  sku: String!
  nome: String!
  slug: String!
  categoriaId: ID!
  marca: String
  unidadeMedida: String
  descricaoCurta: String
  descricaoTecnica: String
  ncm: String
  origemMercadoria: String!
  pesoKg: Decimal
  alturaCm: Decimal
  larguraCm: Decimal
  comprimentoCm: Decimal
  precoCusto: Decimal
  precoVenda: Decimal!
  precoEfetivo: Decimal!
  estoqueMinimo: Decimal
  controlaEstoque: Boolean!
  ativo: Boolean!
  destaque: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  score: Float!
}

"Hit de busca do backoffice — produto (inclui inativos) + score."
type ItemBuscaStaff {
  id: ID!
  sku: String!
  nome: String!
  slug: String!
  categoriaId: ID!
  marca: String
  unidadeMedida: String
  descricaoCurta: String
  descricaoTecnica: String
  ncm: String
  origemMercadoria: String!
  pesoKg: Decimal
  alturaCm: Decimal
  larguraCm: Decimal
  comprimentoCm: Decimal
  precoCusto: Decimal
  precoVenda: Decimal!
  estoqueMinimo: Decimal
  controlaEstoque: Boolean!
  ativo: Boolean!
  destaque: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  score: Float!
}

type BuscaPortalResultado {
  itens: [ItemBuscaPortal!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
  facetas: Facetas!
}

type BuscaStaffResultado {
  itens: [ItemBuscaStaff!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
  facetas: Facetas!
}

type SugestaoProduto {
  produtoId: ID!
  nome: String!
  sku: String!
}

type ReindexResultado {
  indexados: Int!
}

type CarrinhoItem {
  id: ID!
  carrinhoId: ID!
  produtoId: ID!
  quantidade: Decimal!
  precoUnitario: Decimal!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Carrinho {
  id: ID!
  uuid: UUID!
  contatoId: ID
  empresaId: ID
  sessionId: String
  status: StatusCarrinho!
  createdAt: DateTime!
  updatedAt: DateTime!
  itens: [CarrinhoItem!]!
  total: Decimal!
}

type LogAuditoria {
  id: ID!
  usuarioId: ID
  entidade: String!
  entidadeId: ID!
  acao: AcaoAuditoria!
  dadosAntes: JSON
  dadosDepois: JSON
  ip: String
  createdAt: DateTime!
}

type LogAuditoriaPagina {
  itens: [LogAuditoria!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

input CheckoutInput {
  enderecoFaturamentoId: ID!
  enderecoEntregaId: ID!
  condicaoPagamento: String
  observacoes: String
}

extend type Query {
  "Catálogo B2B com o preço efetivo da empresa do contato autenticado."
  catalogoPortal(
    pagina: Int
    porPagina: Int
    categoriaId: ID
    busca: String
    destaque: Boolean
  ): CatalogoPortalPagina!

  "Busca do portal — fuzzy + filtros + facetas, preço efetivo B2B."
  buscarProdutosPortal(
    pagina: Int
    porPagina: Int
    q: String
    categoriaId: ID
    marca: String
    precoMin: Decimal
    precoMax: Decimal
  ): BuscaPortalResultado!

  "Autocomplete do portal — sugestões leves (mínimo 2 caracteres)."
  sugerirProdutosPortal(q: String!, limite: Int): [SugestaoProduto!]!

  "Carrinho atual do contato autenticado (itens + total)."
  carrinhoPortal: Carrinho!

  "Busca do backoffice — inclui produtos inativos, preço de catálogo."
  buscarProdutosStaff(
    pagina: Int
    porPagina: Int
    q: String
    categoriaId: ID
    marca: String
    precoMin: Decimal
    precoMax: Decimal
  ): BuscaStaffResultado!

  "Trilha de auditoria (append-only) — somente admin."
  auditoria(
    pagina: Int
    porPagina: Int
    entidade: String
    entidadeId: ID
    usuarioId: ID
  ): LogAuditoriaPagina!
}

extend type Mutation {
  "Adiciona item ao carrinho (ou soma a quantidade se já existe)."
  adicionarItemCarrinho(produtoId: ID!, quantidade: Decimal!): Carrinho!
  "Altera a quantidade de um item do carrinho."
  atualizarItemCarrinho(produtoId: ID!, quantidade: Decimal!): Carrinho!
  removerItemCarrinho(produtoId: ID!): Carrinho!
  "Carrinho → pedido aguardando_pagamento (transação única)."
  checkoutPortal(input: CheckoutInput!): Pedido!

  "Reconstrução completa do índice de busca (somente admin)."
  reindexarBusca: ReindexResultado!
}
