# Fiscal (notas fiscais) e financeiro (parcelas/pagamentos + caixa).

type NotaFiscal {
  id: ID!
  numero: String!
  serie: String
  chaveAcesso: String
  pedidoId: ID!
  empresaId: ID!
  tipo: TipoNotaFiscal!
  status: StatusNotaFiscal!
  naturezaOperacao: String
  cfop: String
  emitidaEm: DateTime
  valorProdutos: Decimal
  valorFrete: Decimal
  valorDesconto: Decimal
  valorTotal: Decimal
  protocoloAutorizacao: String
  xmlPath: String
  pdfPath: String
  motivoCancelamento: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NotaFiscalItem {
  id: ID!
  nfId: ID!
  produtoId: ID
  codigo: String
  descricao: String
  ncm: String
  cfop: String
  unidade: String
  quantidade: Decimal
  valorUnitario: Decimal
  valorTotal: Decimal
  icmsAliquota: Decimal
  icmsValor: Decimal
  ipiAliquota: Decimal
  ipiValor: Decimal
  pisValor: Decimal
  cofinsValor: Decimal
}

type NotaFiscalDetalhe {
  nota: NotaFiscal!
  itens: [NotaFiscalItem!]!
}

type NotaFiscalPagina {
  itens: [NotaFiscal!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

type Pagamento {
  id: ID!
  pedidoId: ID!
  parcelaNum: Int!
  valor: Decimal!
  vencimento: Date!
  pagoEm: DateTime
  status: StatusPagamento!
  formaPagamentoId: ID
  caixaMovimentacaoId: ID
  observacao: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PagamentoPagina {
  itens: [Pagamento!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

type Caixa {
  id: ID!
  abertoPor: ID!
  abertoEm: DateTime!
  valorAbertura: Decimal!
  fechadoPor: ID
  fechadoEm: DateTime
  valorFechamentoCalculado: Decimal
  valorFechamentoInformado: Decimal
  diferenca: Decimal
  status: StatusCaixa!
}

type CaixaMovimentacao {
  id: ID!
  caixaId: ID!
  tipo: TipoCaixaMovimentacao!
  valor: Decimal!
  formaPagamentoId: ID
  pagamentoId: ID
  usuarioId: ID
  descricao: String
  createdAt: DateTime!
}

type CaixaPagina {
  itens: [Caixa!]!
  total: Int!
  pagina: Int!
  porPagina: Int!
  totalPaginas: Int!
}

# ── Inputs ───────────────────────────────────────────────────────────────────

input GerarParcelasInput {
  pedidoId: ID!
  quantidade: Int!
  primeiroVencimento: Date!
  intervaloDias: Int
  formaPagamentoId: ID
}

input BaixarPagamentoInput {
  formaPagamentoId: ID!
  observacao: String
}

input LancarCaixaInput {
  tipo: TipoCaixaMovimentacao!
  valor: Decimal!
  formaPagamentoId: ID
  descricao: String
}

extend type Query {
  notasFiscais(
    pagina: Int
    porPagina: Int
    status: StatusNotaFiscal
    empresaId: ID
    pedidoId: ID
  ): NotaFiscalPagina!
  "Nota fiscal + itens."
  notaFiscal(id: ID!): NotaFiscalDetalhe

  pagamentos(
    pagina: Int
    porPagina: Int
    pedidoId: ID
    status: StatusPagamento
    "Parcelas vencidas até a data (YYYY-MM-DD)."
    vencidosEm: Date
  ): PagamentoPagina!

  "Sessão de caixa aberta no momento (ou null)."
  caixaAberto: Caixa
  caixas(pagina: Int, porPagina: Int): CaixaPagina!
  caixaMovimentacoes(caixaId: ID!): [CaixaMovimentacao!]!
}

extend type Mutation {
  "Monta a NF a partir do pedido faturável — rascunho até autorizar."
  emitirNotaFiscal(pedidoId: ID!): NotaFiscal!
  "Envia ao gateway fiscal — grava chave/protocolo ou marca rejeição."
  autorizarNotaFiscal(id: ID!): NotaFiscal!
  "Cancela nota autorizada — evento fiscal com motivo obrigatório."
  cancelarNotaFiscal(id: ID!, motivo: String!): NotaFiscal!

  "Plano de parcelas do pedido — a última absorve o arredondamento."
  gerarParcelas(input: GerarParcelasInput!): [Pagamento!]!
  "Baixa de parcela — recebimento no caixa aberto na mesma transação."
  baixarPagamento(id: ID!, input: BaixarPagamentoInput!): Pagamento!
  "Estorno — lançamento compensatório no caixa aberto."
  estornarPagamento(id: ID!, motivo: String!): Pagamento!

  "Abre sessão de caixa com fundo de troco."
  abrirCaixa(valorAbertura: Decimal!): Caixa!
  "Suprimento, sangria ou despesa no caixa aberto."
  lancarCaixa(input: LancarCaixaInput!): CaixaMovimentacao!
  "Fecha o caixa — o serviço confere calculado × informado (quebra)."
  fecharCaixa(valorInformado: Decimal!): Caixa!
}
