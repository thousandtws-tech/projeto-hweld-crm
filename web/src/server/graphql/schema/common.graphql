# ── Escalares ────────────────────────────────────────────────────────────────
# O backend serializa Decimal/NaiveDate/DateTime como string; `Id<T>` como i64.
# No schema, ids são `ID` (serializados como string) e dinheiro é `Decimal`.

scalar Decimal
scalar DateTime
scalar Date
scalar JSON
scalar UUID

